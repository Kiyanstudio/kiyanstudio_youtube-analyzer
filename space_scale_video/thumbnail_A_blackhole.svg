<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="62%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a0a18"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="disk" cx="50%" cy="50%" r="50%">
      <stop offset="34%" stop-color="#000000"/>
      <stop offset="40%" stop-color="#3a0a00"/>
      <stop offset="55%" stop-color="#ff5a00"/>
      <stop offset="70%" stop-color="#ffb300"/>
      <stop offset="82%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="rgba(120,30,0,0)"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#000"/>
      <stop offset="100%" stop-color="#1a0500"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="90" cy="80" r="1.6"/><circle cx="200" cy="160" r="1.1"/><circle cx="150" cy="300" r="1.4"/>
    <circle cx="60" cy="450" r="1.2"/><circle cx="260" cy="520" r="1.5"/><circle cx="120" cy="620" r="1.1"/>
    <circle cx="330" cy="90" r="1.2"/><circle cx="420" cy="240" r="1"/><circle cx="500" cy="640" r="1.4"/>
    <circle cx="700" cy="60" r="1.2"/><circle cx="1180" cy="120" r="1.5"/><circle cx="1230" cy="300" r="1.2"/>
    <circle cx="1150" cy="560" r="1.3"/><circle cx="980" cy="650" r="1.1"/><circle cx="1080" cy="420" r="1"/>
    <circle cx="40" cy="220" r="1"/><circle cx="300" cy="400" r="1"/><circle cx="240" cy="240" r="0.9"/>
  </g>

  <!-- black hole -->
  <g transform="translate(880,360)" filter="url(#glow)">
    <ellipse cx="0" cy="0" rx="300" ry="300" fill="url(#disk)"/>
    <ellipse cx="0" cy="-6" rx="250" ry="60" fill="#ffce6a" opacity="0.55"/>
    <circle cx="0" cy="0" r="118" fill="url(#core)"/>
    <circle cx="0" cy="0" r="118" fill="#000"/>
  </g>

  <!-- text -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="start">
    <text x="60" y="250" font-size="120" fill="#ffffff" stroke="#000" stroke-width="10" paint-order="stroke">95% OF</text>
    <text x="60" y="375" font-size="120" fill="#ffffff" stroke="#000" stroke-width="10" paint-order="stroke">SPACE IS</text>
    <text x="60" y="510" font-size="132" fill="#ffd200" stroke="#000" stroke-width="12" paint-order="stroke">INVISIBLE</text>
  </g>
  <text x="60" y="600" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="58" fill="#ffffff" stroke="#000" stroke-width="8" paint-order="stroke">…AND NO ONE KNOWS WHY 😨</text>
</svg>
