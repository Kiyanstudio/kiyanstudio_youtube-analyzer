<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgB" cx="85%" cy="45%" r="90%">
      <stop offset="0%" stop-color="#11131f"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d6"/>
      <stop offset="35%" stop-color="#ffd24a"/>
      <stop offset="70%" stop-color="#ff8a00"/>
      <stop offset="100%" stop-color="rgba(255,90,0,0)"/>
    </radialGradient>
    <radialGradient id="earth" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#6fb7ff"/>
      <stop offset="60%" stop-color="#1f6fd0"/>
      <stop offset="100%" stop-color="#0a2d5e"/>
    </radialGradient>
    <filter id="glowB" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bgB)"/>
  <g fill="#ffffff">
    <circle cx="120" cy="120" r="1.5"/><circle cx="240" cy="320" r="1.2"/><circle cx="80" cy="520" r="1.3"/>
    <circle cx="360" cy="200" r="1"/><circle cx="180" cy="640" r="1.2"/><circle cx="420" cy="560" r="1"/>
    <circle cx="520" cy="120" r="1.2"/><circle cx="60" cy="300" r="1.1"/><circle cx="300" cy="440" r="0.9"/>
  </g>

  <!-- giant sun on the right -->
  <circle cx="1230" cy="330" r="430" fill="url(#sun)" filter="url(#glowB)"/>

  <!-- tiny earth -->
  <g filter="url(#glowB)">
    <circle cx="430" cy="470" r="26" fill="url(#earth)"/>
  </g>
  <text x="430" y="540" font-family="Arial, sans-serif" font-weight="700" font-size="30" fill="#9fd2ff" text-anchor="middle">EARTH</text>

  <!-- text -->
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" text-anchor="start">
    <text x="55" y="210" font-size="118" fill="#ffffff" stroke="#000" stroke-width="10" paint-order="stroke">YOU ARE</text>
    <text x="55" y="330" font-size="118" fill="#ffffff" stroke="#000" stroke-width="10" paint-order="stroke">THIS</text>
    <text x="55" y="450" font-size="150" fill="#ff3b30" stroke="#000" stroke-width="12" paint-order="stroke">SMALL</text>
  </g>
</svg>
