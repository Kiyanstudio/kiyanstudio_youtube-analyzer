<!--
  Loader: React, ReactDOM and framer-motion are all ES modules now (framer-motion
  no longer ships a UMD/window global), so we import them as modules from esm.sh
  with a single shared React instance, expose them as the globals the JSX code
  below expects (window.React / window.ReactDOM / window.Motion), THEN load Babel
  and compile the text/babel scripts. Babel only auto-runs on DOMContentLoaded;
  loading it late means we trigger the compile ourselves once globals are ready.
-->
<script type="module">
  import React from "https://esm.sh/react@18.3.1";
  import * as ReactDOMClient from "https://esm.sh/react-dom@18.3.1/client?deps=react@18.3.1";
  import * as Motion from "https://esm.sh/framer-motion@11.11.17?deps=react@18.3.1,react-dom@18.3.1";

  window.React = React;
  window.ReactDOM = ReactDOMClient;   // exposes createRoot
  window.Motion = Motion;             // exposes { motion, AnimatePresence, ... }
  window.FramerMotion = Motion;

  const babel = document.createElement("script");
  babel.src = "https://unpkg.com/@babel/standalone@7.29.0/babel.min.js";
  babel.onload = () => window.Babel.transformScriptTags();
  babel.onerror = () => console.error("Babel CDN failed to load — check your network connection.");
  document.head.appendChild(babel);
</script>

    var cfg = {
      theme: {
        extend: {
          fontFamily: {
            heading: ["'Instrument Serif'", "serif"],
            body: ["'Barlow'", "sans-serif"],
          },
          borderRadius: {
            DEFAULT: "9999px",
          },
        },
      },
    };
    if (typeof tailwind !== "undefined") {
      tailwind.config = cfg;
    } else {
      var tries = 0;
      var iv = setInterval(function () {
        if (typeof tailwind !== "undefined") {
          tailwind.config = cfg;
          clearInterval(iv);
        } else if (++tries > 100) {
          clearInterval(iv);
          console.warn("Tailwind CDN failed to load — check your network connection.");
        }
      }, 50);
    }
  })();
</script>

<!-- Ring graphic (the recurring health-ring motif) -->
<script type="text/babel">
const ActivityRing = ({ size = 200, stroke = 16, gap = 8,
  move = 0.82, exercise = 0.64, stand = 0.93, animate = true, idPrefix = "r" }) => {
  const tracks = [
    { p: move, color: "#FF375F", glow: "#FF2D55" },
    { p: exercise, color: "#9DFF00", glow: "#76FF03" },
    { p: stand, color: "#00E5FF", glow: "#18FFFF" },
  ];
  const c = size / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <defs>
        {tracks.map((t, i) => (
          <linearGradient key={i} id={`${idPrefix}-grad-${i}`} x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stopColor={t.glow} />
            <stop offset="100%" stopColor={t.color} />
          </linearGradient>
        ))}
      </defs>
      {tracks.map((t, i) => {
        const r = c - stroke / 2 - i * (stroke + gap);
        const circ = 2 * Math.PI * r;
        const target = circ * (1 - t.p);
        return (
          <g key={i} transform={`rotate(-90 ${c} ${c})`}>
            <circle cx={c} cy={c} r={r} fill="none"
              stroke="rgba(255,255,255,0.08)" strokeWidth={stroke} />
            <circle cx={c} cy={c} r={r} fill="none"
              stroke={`url(#${idPrefix}-grad-${i})`} strokeWidth={stroke}
              strokeLinecap="round"
              strokeDasharray={circ}
              style={animate ? {
                "--circ": circ, "--target": target,
                strokeDashoffset: target,
                animation: `drawRing 1.6s cubic-bezier(.22,1,.36,1) ${0.5 + i * 0.2}s both`,
                filter: `drop-shadow(0 0 6px ${t.glow}88)`,
              } : { strokeDashoffset: target, filter: `drop-shadow(0 0 6px ${t.glow}88)` }} />
          </g>
        );
      })}
    </svg>
  );
};
window.ActivityRing = ActivityRing;
</script>

<!-- BlurText: word-by-word blur-in -->
<script type="text/babel">
const { motion } = window.Motion;
const { useState, useRef, useEffect } = React;

const BlurText = ({ text, className = "" }) => {
  const words = text.split(" ");
  const [inView, setInView] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver(
      ([entry]) => { if (entry.isIntersecting) { setInView(true); obs.disconnect(); } },
      { threshold: 0.1 }
    );
    obs.observe(el);
    return () => obs.disconnect();
  }, []);

  return (
    <p ref={ref} className={className}
      style={{ display: "flex", flexWrap: "wrap", justifyContent: "center", rowGap: "0.1em" }}>
      {words.map((word, i) => (
        <motion.span key={i}
          initial={{ filter: "blur(10px)", opacity: 0, y: 50 }}
          animate={inView ? {
            filter: ["blur(10px)", "blur(5px)", "blur(0px)"],
            opacity: [0, 0.5, 1],
            y: [50, -5, 0],
          } : {}}
          transition={{ duration: 0.7, times: [0, 0.5, 1], ease: "easeOut", delay: (i * 100) / 1000 }}
          style={{ display: "inline-block", marginRight: "0.28em" }}>
          {word}
        </motion.span>
      ))}
    </p>
  );
};
window.BlurText = BlurText;
</script>

<!-- FadingVideo: rAF crossfade, manual loop -->
<script type="text/babel">
const FadingVideo = ({ src, className = "", style = {} }) => {
  const videoRef = React.useRef(null);
  const rafRef = React.useRef(null);
  const fadingOutRef = React.useRef(false);
  const FADE_MS = 500;
  const FADE_OUT_LEAD = 0.55;

  const fadeTo = (target, duration) => {
    const video = videoRef.current;
    if (!video) return;
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    const start = parseFloat(video.style.opacity) || 0;
    const delta = target - start;
    const t0 = performance.now();
    const step = (now) => {
      const t = Math.min((now - t0) / duration, 1);
      video.style.opacity = String(start + delta * t);
      if (t < 1) rafRef.current = requestAnimationFrame(step);
    };
    rafRef.current = requestAnimationFrame(step);
  };

  React.useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    video.style.opacity = "0";

    const onLoaded = () => { video.style.opacity = "0"; video.play(); fadeTo(1, FADE_MS); };
    const onTime = () => {
      if (!fadingOutRef.current && video.duration) {
        const remaining = video.duration - video.currentTime;
        if (remaining <= FADE_OUT_LEAD && remaining > 0) {
          fadingOutRef.current = true;
          fadeTo(0, FADE_MS);
        }
      }
    };
    const onEnded = () => {
      video.style.opacity = "0";
      setTimeout(() => {
        video.currentTime = 0;
        video.play();
        fadingOutRef.current = false;
        fadeTo(1, FADE_MS);
      }, 100);
    };

    video.addEventListener("loadeddata", onLoaded);
    video.addEventListener("timeupdate", onTime);
    video.addEventListener("ended", onEnded);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      video.removeEventListener("loadeddata", onLoaded);
      video.removeEventListener("timeupdate", onTime);
      video.removeEventListener("ended", onEnded);
    };
  }, [src]);

  return (
    <video ref={videoRef} src={src} autoPlay muted playsInline preload="auto"
      className={className} style={{ opacity: 0, ...style }} />
  );
};
window.FadingVideo = FadingVideo;
</script>
